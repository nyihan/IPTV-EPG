name: Daily Myanmar EPG & Playlist Sync

on:
  schedule:
    - cron: '30 17 * * *' # Runs daily at 17:30 UTC (00:00 Myanmar Standard Time)
  workflow_dispatch:

jobs:
  build-and-sync-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Myanmar Standard Time (+06:30) EPG
        # This builds epg.xml.gz with Myanmar timezone and English transliteration
        # iu-ott.site ဆီသို့ လုံးဝ request မပို့သောကြောင့် Cloudflare Bot Block လုံးဝ မခံရပါ
        run: python build_epg.py final_playlist.m3u epg.xml.gz

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add epg.xml.gz final_playlist.m3u
          
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto Update Daily EPG (MMT +06:30)"
          
          git pull --rebase origin main
          git push
